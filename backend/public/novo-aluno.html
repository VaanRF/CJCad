<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Aluno - CJ Restinga</title>
    <link rel="stylesheet" href="novo-aluno.css" />
</head>
<body>
    <div class="container">
        <h1>📝 Cadastrar Novo Aluno</h1>
        <form id="formNovoAluno">
            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" required />
            </div>

            <div class="form-group">
                <label for="nascimento">Data de Nascimento *</label>
                <input type="date" id="nascimento" required />
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" />
            </div>

            <div class="form-group">
                <label for="telefone1">Telefone (Celular/Whatsapp) *</label>
                <input type="text" id="telefone1" placeholder="(51) 99999-9999" required />
            </div>

            <div class="form-group">
                <label for="telefone2">Telefone (Recado)</label>
                <input type="text" id="telefone2" placeholder="(51) 99999-9999" />
            </div>

            <div class="form-group">
                <label for="responsavel">Nome do Responsável *</label>
                <input type="text" id="responsavel" required />
            </div>

            <div class="form-group">
                <label for="cpfResponsavel">CPF do Responsável</label>
                <input type="text" id="cpfResponsavel" placeholder="000.000.000-00" />
            </div>

            <div class="form-group">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" />
            </div>

            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" />
            </div>

            <div class="form-group">
                <label for="escola">Escola</label>
                <input type="text" id="escola" />
            </div>

            <div class="form-group">
                <label for="serie">Ano/Série</label>
                <input type="text" id="serie" />
            </div>

            <div class="form-group">
                <label for="turnoEscola">Turno Escola</label>
                <select id="turnoEscola">
                    <option value="">Selecione</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                    <option value="Integral">Integral</option>
                </select>
            </div>

            <div class="form-group">
                <label for="turnoCJ">Turno CJ</label>
                <select id="turnoCJ">
                    <option value="">Selecione</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                </select>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-salvar">✅ Salvar Aluno</button>
            <a href="index.html" class="btn-cancelar">Cancelar</a>
        </form>
        <div id="mensagem" style="margin-top:20px;"></div>
    </div>

    <script src="novo-aluno.js"></script>
</body>
</html>
